<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">RoundtableCI</title>
  <desc id="d">Which variant of your AI holds up, measured from real sessions. Four model variants on a line; one orange beam travels to the one that held up on this run.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#EDE8DD" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0B0B0A" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B0B0A" stop-opacity=".85"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="#0B0B0A"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" fill="none" stroke="#EDE8DD" stroke-opacity=".18"/>

  <!-- wordmark: static, never animated -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#EDE8DD">
    <text x="64" y="150" font-size="68" letter-spacing="-1">RoundtableCI</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#EDE8DD">
    <text x="66" y="70" font-size="13" letter-spacing="3" fill-opacity=".55">REFLECTIONS · RANKINGS · COLLECTOR</text>
    <text x="66" y="196" font-size="22" fill-opacity=".9">Your AI comes in variants.</text>
    <text x="66" y="228" font-size="22" fill-opacity=".9">We measure which one holds up.</text>
    <text x="66" y="296" font-size="13" letter-spacing="1" fill-opacity=".5">from real coding sessions · labels and numbers, never code</text>
  </g>

  <!-- the line of variants -->
  <g transform="translate(760 0)">
    <line x1="0" y1="180" x2="460" y2="180" stroke="#EDE8DD" stroke-opacity=".28" stroke-width="1.5"/>
    <g fill="#0B0B0A" stroke="#EDE8DD" stroke-width="1.5">
      <circle cx="30"  cy="180" r="15"/>
      <circle cx="165" cy="180" r="15"/>
      <circle cx="300" cy="180" r="15"/>
      <circle cx="430" cy="180" r="15"/>
    </g>
    <!-- monograms, no provider logos -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#EDE8DD" text-anchor="middle">
      <text x="30"  y="185">A</text>
      <text x="165" y="185">B</text>
      <text x="300" y="185">C</text>
      <text x="430" y="185">D</text>
    </g>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#EDE8DD" fill-opacity=".5" text-anchor="middle">
      <text x="30"  y="226">flagship</text>
      <text x="165" y="226">mid</text>
      <text x="300" y="226">cheap</text>
      <text x="430" y="226">cheap</text>
    </g>

    <!-- the beam: the one orange element, travels and settles on one variant -->
    <line x1="0" y1="180" x2="0" y2="180" stroke="#FF5A1F" stroke-width="3" stroke-linecap="round">
      <animate attributeName="x2" values="0;165;165;165" keyTimes="0;.45;.9;1" dur="6s" repeatCount="indefinite"/>
    </line>
    <circle cx="165" cy="180" r="19" fill="none" stroke="#FF5A1F" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.4;.5;.9;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <text x="0" y="120" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#EDE8DD" fill-opacity=".5">ONE FAMILY · SAMPLE DATA</text>
  </g>

  <rect x="900" y="0" width="380" height="360" fill="url(#fade)" opacity=".0"/>
</svg>
